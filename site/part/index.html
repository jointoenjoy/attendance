<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCG · PILOT · HTM｜練息場活動參與統計</title>
<style>
  /* ===== 練息場視覺系統（handbook/設計規範/練息場視覺系統.md）===== */
  :root{
    /* 品牌核心 */
    --brand:#004D89; --brand-deep:#003864; --brand-soft:#6694B8; --ink:#032639;
    /* 主藍階 */
    --blue-300:#B2CADC; --blue-200:#CCDCE8; --blue-100:#E5EDF3;
    /* 中性灰藍階 */
    --n-700:#4B6472; --n-500:#6F838E; --n-300:#93A2AA; --n-100:#DBE0E3;
    /* 粉彩底 */
    --p-blue:#CCE0F7; --p-mint:#D3F5EC; --p-green:#F3FBE8; --p-peach:#FFEBD3;
    --p-yellow:#FFFBEA; --p-pink:#FEF0EA; --p-lav:#E6E5FB;

    --bg:#ffffff; --card:#ffffff; --line:#DBE0E3; --muted:#6F838E; --hair:#EDF1F3;
    --y25:#6694B8; --y26:#004D89;
    --yes:#1E8F70; --wait:#B26A00; --leave:#B4593A; --checkin:#004D89;
    --hero-a:#CCE0F7; --hero-b:#D3F5EC; --hero-c:#FFFBEA;
    --glass:rgba(255,255,255,.66); --glass-edge:rgba(255,255,255,.75);
    --shadow:0 1px 2px rgba(3,38,57,.04),0 10px 30px rgba(3,38,57,.07);
    --shadow-lift:0 2px 6px rgba(3,38,57,.06),0 18px 44px rgba(3,38,57,.10);

    --radius:16px;
    /* 近臨界阻尼彈簧（apple-design §4：damping 1.0 / response ~0.4） */
    --spring:cubic-bezier(.32,.72,0,1);
  }
  /* 深色：用品牌 Black #032639 當底，仍在品牌色系內 */
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#041d2b; --card:#062b3d; --ink:#E5EDF3; --line:#0e4159; --hair:#0a3549;
    --muted:#93A2AA; --brand:#8CB3E0; --brand-deep:#B2CADC; --brand-soft:#6694B8;
    --y25:#93A2AA; --y26:#8CB3E0; --yes:#23CDA0; --wait:#FFC27C; --leave:#F9B497; --checkin:#8CB3E0;
    --hero-a:#073349; --hero-b:#06403c; --hero-c:#0b2f42;
    --glass:rgba(6,43,61,.62); --glass-edge:rgba(140,179,224,.22);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);
    --shadow-lift:0 2px 6px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --bg:#041d2b; --card:#062b3d; --ink:#E5EDF3; --line:#0e4159; --hair:#0a3549; --muted:#93A2AA;
    --brand:#8CB3E0; --brand-deep:#B2CADC; --brand-soft:#6694B8;
    --y25:#93A2AA; --y26:#8CB3E0; --yes:#23CDA0; --wait:#FFC27C; --leave:#F9B497; --checkin:#8CB3E0;
    --hero-a:#073349; --hero-b:#06403c; --hero-c:#0b2f42;
    --glass:rgba(6,43,61,.62); --glass-edge:rgba(140,179,224,.22);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);
    --shadow-lift:0 2px 6px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
  .wrap{max-width:960px;margin:0 auto;padding:22px 18px 80px;}
  a{color:var(--brand)}

  /* ===== Hero：低閱讀量區塊 → 有機造型輕量動態（視覺系統 §套用原則 4）===== */
  .hero{position:relative;overflow:hidden;border-radius:24px;padding:30px 24px 26px;margin:0 0 22px;
    background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 58%,var(--hero-c) 100%);}
  .hero>*:not(.orbs){position:relative;z-index:1}
  .orbs{position:absolute;inset:0;pointer-events:none}
  .orb{position:absolute;display:block;opacity:.55;will-change:transform;
    border-radius:58% 42% 47% 53% / 45% 52% 48% 55%;}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .orb{opacity:.2} }
  :root[data-theme="dark"] .orb{opacity:.2}
  .o1{width:158px;height:158px;background:var(--p-mint);left:-44px;top:-52px;animation:drift1 26s ease-in-out infinite alternate}
  .o2{width:98px;height:98px;background:var(--p-peach);right:7%;top:-32px;animation:drift2 22s ease-in-out infinite alternate}
  .o3{width:72px;height:72px;background:var(--p-lav);right:-18px;bottom:-26px;animation:drift3 30s ease-in-out infinite alternate}
  .o4{width:46px;height:46px;background:var(--p-yellow);left:32%;bottom:-18px;animation:drift1 19s ease-in-out infinite alternate-reverse}
  .o5{width:30px;height:30px;background:var(--p-blue);left:15%;top:24px;animation:drift2 24s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate3d(26px,18px,0) rotate(18deg) scale(1.08)}}
  @keyframes drift2{to{transform:translate3d(-22px,20px,0) rotate(-14deg) scale(1.1)}}
  @keyframes drift3{to{transform:translate3d(-18px,-22px,0) rotate(12deg) scale(1.06)}}

  .eyebrow{font-size:.76rem;letter-spacing:.16em;color:var(--brand);font-weight:700;margin:0 0 8px}
  /* 大標題：不斷行，字級隨畫面縮放；大字用負字距（apple-design §15）*/
  h1{margin:0;color:var(--brand);font-weight:800;white-space:nowrap;
    font-size:clamp(.95rem,4.45vw,2rem);line-height:1.18;letter-spacing:-.022em}

  /* ===== 卡片 / 區塊 ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px 20px 16px;margin:18px 0}
  .cardhd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
  .card h2{font-size:1.12rem;margin:0;font-weight:800;letter-spacing:-.012em;color:var(--brand)}

  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-size:.92rem}
  th,td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--hair);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead .grp{font-size:.74rem;letter-spacing:.06em;font-weight:800;border-bottom:2px solid var(--line);padding-bottom:4px}
  thead .grp.y25{color:var(--y25)} thead .grp.y26{color:var(--y26)}
  thead th{font-size:.76rem;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line);letter-spacing:.01em}
  thead th.y25{color:var(--y25)} thead th.y26{color:var(--y26)}
  tbody td{font-size:.95rem}
  tbody tr{transition:background-color .16s var(--spring)}
  tbody tr:hover{background:color-mix(in srgb,var(--p-blue) 34%,transparent)}
  .sub td:first-child{padding-left:26px;font-weight:600}
  .grouphead td{font-weight:800;color:var(--brand);background:color-mix(in srgb,var(--p-blue) 40%,transparent)}
  .subtot td{font-weight:800;border-bottom:2px solid var(--line);background:color-mix(in srgb,var(--p-blue) 22%,transparent)}
  .big{font-weight:800;font-size:1.02rem}
  .z{color:var(--n-300)}
  tfoot td{border-top:2px solid var(--line);font-weight:800;background:color-mix(in srgb,var(--p-mint) 46%,transparent)}
  .divider{border-left:2px solid var(--line)}
  .rate{color:var(--n-300);font-size:.86rem}
  .rate.on{color:var(--brand);font-weight:700}

  /* ===== 數據說明：小字底線連結 ＋ 材質化彈窗（apple-design §12）===== */
  .notelink{font:inherit;font-size:.8rem;color:var(--muted);background:none;border:0;padding:2px 0;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;
    transition:color .16s var(--spring),opacity .1s}
  .notelink:hover{color:var(--brand)}
  .notelink:active{opacity:.55}
  .notebar{margin:6px 0 14px}
  dialog#noteDlg{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);
    padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:var(--shadow-lift)}
  dialog#noteDlg::backdrop{background:rgba(3,38,57,.34);backdrop-filter:blur(6px)}
  dialog#noteDlg[open]{animation:dlgIn .38s var(--spring)}
  /* 材質「浮現」而非單純淡入：模糊＋縮放同時動 */
  @keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.96);filter:blur(8px)}
                   to{opacity:1;transform:none;filter:blur(0)}}
  .dlghd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px}
  .dlghd h4{margin:0;font-size:1rem;font-weight:800;color:var(--brand)}
  .dlgclose{background:none;border:0;color:var(--muted);font-size:1.2rem;line-height:1;cursor:pointer;padding:4px 6px;
    border-radius:999px;transition:transform .1s var(--spring),background-color .16s}
  .dlgclose:hover{background:var(--blue-100)}
  .dlgclose:active{transform:scale(.92)}
  .dlgbody{padding:0 20px 22px;font-size:.85rem;color:var(--n-500);line-height:1.85}
  .dlgbody b{color:var(--ink);font-weight:700}
  .dlgbody p{margin:0 0 10px}
  .dlgbody code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem}

  /* ===== 員工總數 / 參與率 ===== */
  .hcbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px;font-size:.82rem}
  .btn{font:inherit;font-size:.82rem;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    transition:transform .1s var(--spring),border-color .16s,background-color .16s}
  .btn:hover{border-color:var(--brand-soft)}
  .btn:active{transform:scale(.96)}          /* 按下就給回饋，不等放開（apple-design §1）*/
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
  .hcinfo{color:var(--muted)}
  .hcmsg{color:var(--yes);font-weight:700}
  .hcmsg.bad{color:var(--leave)}
  input.hc{font:inherit;font-size:.9rem;width:74px;text-align:right;padding:3px 6px;border-radius:9px;
    border:1px solid transparent;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;
    transition:border-color .18s var(--spring),background-color .18s var(--spring)}
  input.hc:disabled{color:var(--n-300);-webkit-text-fill-color:var(--n-300)}
  input.hc:not(:disabled){border-color:var(--line);background:var(--blue-100)}
  input.hc:focus{outline:2px solid var(--brand-soft);outline-offset:1px}

  /* ===== 大區塊收合 ===== */
  details.block{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
    box-shadow:var(--shadow);margin:18px 0;overflow:hidden;transition:box-shadow .3s var(--spring)}
  details.block[open]{box-shadow:var(--shadow-lift)}
  details.block>summary{padding:18px 20px}
  details.block>summary .btitle{font-size:1.12rem;font-weight:800;letter-spacing:-.012em;color:var(--brand)}
  details.block>summary .bmeta{font-size:.78rem;color:var(--muted);font-weight:600}
  details.block>summary .bchev{margin-left:auto;color:var(--n-300);font-size:.9rem;transition:transform .34s var(--spring)}
  details.block[open]>summary .bchev{transform:rotate(180deg)}
  details.block>.bbody{padding:0 20px 18px}

  details.yearblk{border:0;background:transparent;box-shadow:none!important;border-radius:0;margin:18px 0 0;overflow:visible}
  details.yearblk>summary{padding:6px 2px;border-bottom:2px solid var(--line);margin-bottom:4px}
  details.yearblk>summary .ytitle{font-size:1.02rem;font-weight:800;color:var(--brand)}
  details.yearblk>summary .ymeta{font-size:.78rem;color:var(--muted);font-weight:600}
  details.yearblk>summary .bchev{margin-left:auto;color:var(--n-300);font-size:.9rem;transition:transform .34s var(--spring)}
  details.yearblk[open]>summary .bchev{transform:rotate(180deg)}

  details{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:10px 0;overflow:hidden}
  summary{cursor:pointer;list-style:none;padding:13px 16px;display:flex;align-items:center;gap:10px;font-weight:700;
    transition:background-color .18s var(--spring)}
  summary::-webkit-details-marker{display:none}
  summary:hover{background:color-mix(in srgb,var(--p-blue) 26%,transparent)}
  summary:active{background:color-mix(in srgb,var(--p-blue) 52%,transparent)}
  summary .chev{transition:transform .34s var(--spring);color:var(--n-300);font-size:.8rem}
  details[open]>summary .chev{transform:rotate(90deg)}
  summary .evname{flex:1;min-width:0}
  summary .evname .dt{color:var(--brand);margin-right:6px}
  summary .nums{font-size:.8rem;color:var(--muted);font-weight:700;white-space:nowrap}
  summary .nums .yes{color:var(--yes)} summary .nums .wait{color:var(--wait)}
  summary .nums .leave{color:var(--leave)} summary .nums .checkin{color:var(--checkin)}
  summary .nums .sep{color:var(--n-300);margin:0 4px}
  .evbody{padding:2px 16px 14px}
  .rawtab{width:100%;border-collapse:collapse;font-size:.86rem;min-width:0}
  .rawtab td,.rawtab th{padding:6px 8px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
  .rawtab th:first-child,.rawtab td:first-child{text-align:left}
  .rawtab th{color:var(--muted);font-size:.74rem;font-weight:700}
  .rawtab thead .yes{color:var(--yes)} .rawtab thead .wait{color:var(--wait)}
  .rawtab thead .leave{color:var(--leave)} .rawtab thead .checkin{color:var(--checkin)}
  .dom{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
  .cotag{color:var(--muted);font-size:.76rem;margin-left:6px}
  .conm{font-weight:700}
  .dash{color:var(--n-300)}
  .notdone{color:var(--wait);font-weight:700;font-size:.78rem}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted);margin:2px 0 4px}
  .legend b{font-weight:700}
  .legend .yes{color:var(--yes)} .legend .wait{color:var(--wait)}
  .legend .leave{color:var(--leave)} .legend .checkin{color:var(--checkin)}

  /* 歸戶區 */
  .maptab td:nth-child(1){font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.84rem;
    white-space:normal;font-weight:700}
  .maptab .vari{font-family:inherit;font-size:.72rem;font-weight:400;color:var(--muted);
    margin-top:2px;line-height:1.5;max-width:22em}
  .maptab td,.maptab th{text-align:left;vertical-align:top}
  .maptab td:nth-child(4),.maptab th:nth-child(4),
  .maptab td:nth-child(5),.maptab th:nth-child(5){text-align:right}

  .foot{color:var(--muted);font-size:.8rem;margin-top:26px;line-height:1.7;border-top:1px solid var(--line);padding-top:16px}

  /* 半透明浮動控制項（apple-design §12：材質層，內容從底下捲過）*/
  .theme{position:fixed;top:14px;right:14px;background:var(--glass);border:1px solid var(--glass-edge);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    color:var(--n-700);border-radius:999px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer;z-index:5;
    box-shadow:0 2px 10px rgba(3,38,57,.08);transition:transform .1s var(--spring)}
  .theme:active{transform:scale(.94)}
  @media (prefers-reduced-transparency:reduce){
    .theme{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}
    dialog#noteDlg::backdrop{backdrop-filter:none}
  }

  /* 進場：輕微上浮 + 淡入，依序錯開 */
  .reveal{opacity:0;transform:translateY(14px)}
  .reveal.in{opacity:1;transform:none;transition:opacity .55s var(--spring),transform .55s var(--spring)}

  /* 減少動態：改為安靜的淡入淡出，不做位移與彈跳（apple-design §14）*/
  @media (prefers-reduced-motion:reduce){
    .orb{animation:none!important}
    .reveal,.reveal.in{opacity:1!important;transform:none!important;transition:none!important}
    dialog#noteDlg[open]{animation:fadeIn .2s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    *,*::before,*::after{transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<button class="theme" id="themeBtn" aria-label="切換深淺色">◐ 主題</button>
<div class="wrap">

  <header class="hero reveal">
    <div class="orbs" aria-hidden="true">
      <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
      <span class="orb o4"></span><span class="orb o5"></span>
    </div>
    <p class="eyebrow">練息場 Join to Enjoy</p>
    <h1>UCG · PILOT · HTM 練息場活動參與統計</h1>
  </header>

  <!-- ===== 總表：實際到場（報到）===== -->
  <section class="card reveal">
    <div class="cardhd">
      <h2>實際到場總表</h2>
      <button class="notelink" data-note="sum">數據說明</button>
    </div>

    <div class="hcbar">
      <button class="btn" id="hcEdit">✎ 編輯員工總數</button>
      <span class="hcinfo" id="hcInfo">填入各年度員工總數，即可算出參與率</span>
      <span id="hcLock" hidden>
        <button class="btn pri" id="hcSave">儲存到雲端</button>
        <button class="btn" id="hcCancel">取消</button>
      </span>
      <span class="hcmsg" id="hcMsg"></span>
    </div>

    <div class="scroll">
      <table id="summary" style="min-width:880px">
        <thead>
          <tr><th rowspan="2">公司</th>
            <th colspan="5" class="grp y25">2025 全年報到</th>
            <th colspan="5" class="grp y26 divider">2026 報到（截至 7/17 已辦）</th></tr>
          <tr><th class="y25">員工總數</th><th class="y25">人次</th><th class="y25">人數</th>
              <th class="y25">人次率</th><th class="y25">人數率</th>
            <th class="y26 divider">員工總數</th><th class="y26">人次</th><th class="y26">人數</th>
              <th class="y26">人次率</th><th class="y26">人數率</th></tr>
        </thead>
        <tbody id="sumBody"></tbody>
        <tfoot id="sumFoot"></tfoot>
      </table>
    </div>
  </section>

  <!-- ===== Email 歸戶區（預設收合）===== -->
  <details class="block reveal" id="mapBlock">
    <summary>
      <span class="btitle">Email 歸戶對照</span>
      <button class="notelink" data-note="map">數據說明</button>
      <span class="bchev">▾</span>
    </summary>
    <div class="bbody">
      <div class="scroll">
        <table class="maptab">
          <thead><tr><th>Email 網域（已合併變體）</th><th>歸戶到</th><th>說明</th><th>2026 筆數</th><th>2026 報到</th></tr></thead>
          <tbody id="mapBody"></tbody>
        </table>
      </div>
    </div>
  </details>

  <!-- ===== 各場明細（大區塊收合，內含 2026 / 2025 兩塊）===== -->
  <details class="block reveal" id="evBlock">
    <summary>
      <span class="btitle">各場明細</span>
      <span class="bmeta" id="evMeta"></span>
      <span class="bchev">▾</span>
    </summary>
    <div class="bbody">
      <div class="legend">
        <span><b class="yes">正取</b>＝取得名額</span>
        <span><b class="wait">候補</b>＝額滿排補</span>
        <span><b class="leave">請假</b>＝取消</span>
        <span><b class="checkin">報到</b>＝當天實際到場</span>
      </div>
      <div class="notebar"><button class="notelink" data-note="ev">數據說明</button></div>

      <details class="yearblk" open>
        <summary><span class="ytitle">2026</span><span class="ymeta" id="m26"></span><span class="bchev">▾</span></summary>
        <div id="ev2026"></div>
      </details>

      <details class="yearblk" open>
        <summary><span class="ytitle">2025</span><span class="ymeta" id="m25"></span><span class="bchev">▾</span></summary>
        <div id="ev2025"></div>
      </details>
    </div>
  </details>

  <p class="foot" id="foot"></p>
</div>

<dialog id="noteDlg">
  <div class="dlghd"><h4 id="dlgTitle">數據說明</h4>
    <button class="dlgclose" id="dlgClose" aria-label="關閉">✕</button></div>
  <div class="dlgbody" id="dlgBody"></div>
</dialog>

<script>

(function(){
  const dlg=document.getElementById("noteDlg");
  function close(){
    if(REDUCE.matches){ dlg.close(); return; }
    // 退場走原路徑回去（apple-design §7）：同樣的模糊＋縮放，只是反過來、快一點
    dlg.getAnimations().forEach(a=>a.cancel());
    const a=dlg.animate(
      [{opacity:1,transform:"none",filter:"blur(0px)"},
       {opacity:0,transform:"translateY(8px) scale(.98)",filter:"blur(6px)"}],
      {duration:220,easing:"ease-in"});
    const shut=()=>dlg.close();
    a.onfinish=shut;
    setTimeout(shut,260);      // 分頁在背景時動畫會凍住，保險起見一定關得掉
  }
  document.querySelectorAll(".notelink").forEach(b=>b.addEventListener("click",e=>{
    e.preventDefault(); e.stopPropagation();       // 在 summary 裡點說明時不要順便展開區塊
    const n=NOTES[b.dataset.note]; if(!n) return;
    document.getElementById("dlgTitle").textContent=n[0];
    document.getElementById("dlgBody").innerHTML=n[1];
    dlg.showModal();
  }));
  document.getElementById("dlgClose").addEventListener("click",close);
  dlg.addEventListener("click",e=>{ if(e.target===dlg) close(); });
  dlg.addEventListener("cancel",e=>{ e.preventDefault(); close(); });
})();

/* ============ 總表 + 員工總數（分年）+ 參與率 ============ */
const HC = {"2025":{}, "2026":{}};            // {年: {公司: 員工總數}}
const hcOf = (y,c) => (HC[y]||{})[c] || 0;
const g25 = c => D.y2025[c] || {visits:0,people:0};
const g26 = c => D.y2026[c] || {att:0,att_uniq:0};
const sum = (list,f) => list.reduce((s,c)=>s+f(c),0);
const rate = (n,hc) => (hc>0) ? '<span class="rate on">'+Math.round(n/hc*100)+'%</span>'
                              : '<span class="rate">—</span>';

(function(){
  const ucg=D.ucgSubs;
  const hcCell=(y,c,cls)=>`<td class="${cls||""}"><input class="hc" type="number" min="0" step="1"
      inputmode="numeric" placeholder="—" aria-label="${esc(c)} ${y} 年員工總數"
      data-y="${y}" data-cat="${esc(c)}" disabled></td>`;
  const row=(c,cls)=>{
    const a=g25(c), b=g26(c);
    return `<tr class="${cls}" data-cat="${esc(c)}"><td>${esc(c)}</td>
      ${hcCell("2025",c,"")}
      <td class="big">${cellNum(a.visits)}</td><td>${cellNum(a.people)}</td>
      <td class="r" data-y="2025" data-n="${a.visits}"></td><td class="r" data-y="2025" data-n="${a.people}"></td>
      ${hcCell("2026",c,"divider")}
      <td class="big">${cellNum(b.att)}</td><td>${cellNum(b.att_uniq)}</td>
      <td class="r" data-y="2026" data-n="${b.att}"></td><td class="r" data-y="2026" data-n="${b.att_uniq}"></td></tr>`;
  };
  let rows=`<tr class="grouphead"><td colspan="11">UCG 聯廣傳播集團</td></tr>`;
  rows+=ucg.map(c=>row(c,"sub")).join("");
  rows+=`<tr class="subtot" id="ucgTot"><td>UCG 小計</td>
    <td id="hcUcg2025" class="z">—</td>
    <td>${sum(ucg,c=>g25(c).visits)}</td><td>${sum(ucg,c=>g25(c).people)}</td>
    <td class="r" data-y="2025" data-n="${sum(ucg,c=>g25(c).visits)}"></td>
    <td class="r" data-y="2025" data-n="${sum(ucg,c=>g25(c).people)}"></td>
    <td id="hcUcg2026" class="z divider">—</td>
    <td>${sum(ucg,c=>g26(c).att)}</td><td>${sum(ucg,c=>g26(c).att_uniq)}</td>
    <td class="r" data-y="2026" data-n="${sum(ucg,c=>g26(c).att)}"></td>
    <td class="r" data-y="2026" data-n="${sum(ucg,c=>g26(c).att_uniq)}"></td></tr>`;
  rows+=row("先勢集團","co2");
  rows+=row("台北博報堂 HTM","co2");
  document.getElementById("sumBody").innerHTML=rows;

  const all=D.cats;
  document.getElementById("sumFoot").innerHTML=
    `<tr id="allTot"><td>三家合計</td>
      <td id="hcAll2025" class="z">—</td>
      <td class="big">${sum(all,c=>g25(c).visits)}</td><td>${sum(all,c=>g25(c).people)}</td>
      <td class="r" data-y="2025" data-n="${sum(all,c=>g25(c).visits)}"></td>
      <td class="r" data-y="2025" data-n="${sum(all,c=>g25(c).people)}"></td>
      <td id="hcAll2026" class="z divider">—</td>
      <td class="big">${sum(all,c=>g26(c).att)}</td><td>${sum(all,c=>g26(c).att_uniq)}</td>
      <td class="r" data-y="2026" data-n="${sum(all,c=>g26(c).att)}"></td>
      <td class="r" data-y="2026" data-n="${sum(all,c=>g26(c).att_uniq)}"></td></tr>`;
})();

function paintRates(){
  const tot={};
  YEARS.forEach(y=>{
    tot["ucg"+y]=sum(D.ucgSubs,c=>hcOf(y,c));
    tot["all"+y]=sum(D.cats,c=>hcOf(y,c));
    document.getElementById("hcUcg"+y).textContent = tot["ucg"+y]>0 ? tot["ucg"+y] : "—";
    document.getElementById("hcAll"+y).textContent = tot["all"+y]>0 ? tot["all"+y] : "—";
  });
  document.querySelectorAll("#summary tr").forEach(tr=>{
    const kind = tr.id==="ucgTot" ? "ucg" : tr.id==="allTot" ? "all" : (tr.dataset.cat ? "row" : null);
    if(!kind) return;
    tr.querySelectorAll("td.r").forEach(td=>{
      const y=td.dataset.y;
      const hc = kind==="row" ? hcOf(y,tr.dataset.cat) : tot[kind+y];
      td.innerHTML = rate(+td.dataset.n, hc);
    });
  });
}
function fillInputs(){
  document.querySelectorAll("input.hc").forEach(i=>{
    const v=(HC[i.dataset.y]||{})[i.dataset.cat];
    i.value = (v===undefined || v===null) ? "" : v;
  });
}
document.addEventListener("input", e=>{
  if(!e.target.classList.contains("hc")) return;
  const y=e.target.dataset.y, c=e.target.dataset.cat;
  const v=parseInt(e.target.value,10);
  if(Number.isFinite(v) && v>=0) HC[y][c]=v; else delete HC[y][c];
  paintRates();
});

/* ---- 雲端讀寫（Cloudflare KV；本機預覽時 API 不存在，靜靜跳過）---- */
const API="/api/part-state";
const msg=(t,bad)=>{const m=document.getElementById("hcMsg");m.textContent=t;m.className="hcmsg"+(bad?" bad":"");};
function anyHC(){ return YEARS.some(y=>Object.keys(HC[y]).length>0); }
function setInfo(updated){
  let t = "填入各年度員工總數，即可算出參與率";
  if(updated && anyHC()){
    const d=new Date(updated);
    t = "雲端最後更新："+(isNaN(d) ? String(updated).slice(0,16)
        : d.toLocaleString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit",
                                    hour:"2-digit",minute:"2-digit",hour12:false}));
  }
  document.getElementById("hcInfo").textContent = t;
}
(async function load(){
  try{
    const r=await fetch(API,{cache:"no-store"});
    if(!r.ok) throw 0;
    const j=await r.json();
    const h=(j&&j.headcount)||{};
    YEARS.forEach(y=>Object.assign(HC[y], h[y]||{}));
    setInfo(j.updated);
  }catch(e){ /* 本機預覽或尚未部署 */ }
  fillInputs(); paintRates();
})();

(function(){
  const edit=document.getElementById("hcEdit"), lock=document.getElementById("hcLock");
  const enable=on=>document.querySelectorAll("input.hc").forEach(i=>i.disabled=!on);
  edit.addEventListener("click",()=>{
    lock.hidden=false; edit.hidden=true; enable(true); msg("");
    const first=document.querySelector("input.hc"); if(first) first.focus();
  });
  document.getElementById("hcCancel").addEventListener("click",()=>{
    lock.hidden=true; edit.hidden=false; enable(false); msg("");
    location.reload();     // 取消＝丟掉本地改動，重新讀雲端最新值
  });
  document.getElementById("hcSave").addEventListener("click",async()=>{
    msg("儲存中…");
    try{
      const r=await fetch(API,{method:"PUT",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({headcount:HC})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){ msg(j.error||("儲存失敗（"+r.status+"）"),true); return; }
      setInfo(j.updated); msg("已儲存到雲端 ✓");
      lock.hidden=true; edit.hidden=false; enable(false);
    }catch(e){ msg("連不上雲端（本機預覽不會儲存）",true); }
  });
})();

(function(){
  const order=D.cats;
  const doms=D.domains.slice().sort((a,b)=>
    (order.indexOf(a.cat)-order.indexOf(b.cat)) || (b.rows-a.rows) || a.key.localeCompare(b.key));

    const seen=(x.seen||[]);
    const vari = seen.length ? `<div class="vari">實際寫法：${seen.map(s=>"@"+esc(s)).join("、")}</div>` : "";
    return `<tr>
      <td>@${esc(x.key)}${vari}</td>

      <td class="z" style="white-space:normal">${esc(x.note)}</td>
      <td>${cellNum(x.rows)}</td><td>${cellNum(x.att)}</td></tr>`;}).join("");
})();

/* ============ 各場明細 ============ */
const TODAY = new Date().toISOString().slice(0,10);
const mmdd = d => { const p=d.split("-"); return (+p[1])+"/"+(+p[2]); };
const grpYear = e => e.date==="2026-01-16" ? "2025" : e.year;

function checkinCell(e,val,isTotal){
  if(e.date>TODAY) return isTotal ? '<span class="notdone">尚未舉辦</span>' : '<span class="dash">—</span>';
  if(!e.has_checkin) return '<span class="dash">—</span>';
  return cellNum(val);
}

function renderEvent(e){
  const t=e.totals, isDom = e.rowkind!=="cat";
  const future = e.date>TODAY;
  const ciSummary = future ? '<span class="notdone">尚未舉辦</span>'
                  : !e.has_checkin ? '<span class="dash">報到 —</span>'
                  : `報到 <span class="checkin">${t.c}</span>`;
  const raw = e.domains.map(d=>`<tr>
      <td>${isDom ? `<span class="dom">@${esc(d.d)}</span><span class="cotag">${esc(d.cat)}</span>`
                  : `<span class="conm">${esc(d.cat)}</span>`}</td>
      <td>${cellNum(d.y)}</td><td>${cellNum(d.w)}</td><td>${cellNum(d.l)}</td>
      <td>${checkinCell(e,d.c,false)}</td></tr>`).join("");
  return `<details>
    <summary><span class="chev">▸</span>
      <span class="evname"><span class="dt">${mmdd(e.date)}</span>${esc(e.title)}</span>
      <span class="nums"><span class="yes">正 ${t.y}</span><span class="sep">·</span>`+
      `<span class="wait">補 ${t.w}</span><span class="sep">·</span>`+
      `<span class="leave">假 ${t.l}</span><span class="sep">·</span>${ciSummary}</span></summary>
    <div class="evbody"><div class="scroll"><table class="rawtab">
      <thead><tr><th>${isDom ? "Email 網域（公司）" : "公司"}</th>
        <th class="yes">正取</th><th class="wait">候補</th><th class="leave">請假</th>
        <th class="checkin">報到</th></tr></thead>
      <tbody>${raw}</tbody>
      <tfoot><tr><td>小計</td><td>${t.y}</td><td>${t.w}</td><td>${t.l}</td>
        <td>${checkinCell(e,t.c,true)}</td></tr></tfoot>
    </table></div></div>
  </details>`;

/* ============ 展開／收合：可隨時抓住、隨時反轉（apple-design §3）============
   不用 CSS transition —— 手勢中的東西必須能從「目前畫面上的值」接手。
   這裡每次都讀當下高度當起點，舊動畫直接取消，所以連點也不會跳。 */
function wireDetails(d){
  if(d.dataset.wired) return;
  d.dataset.wired="1";
  const sum=d.querySelector(":scope > summary");
  const body=Array.from(d.children).find(el=>el.tagName!=="SUMMARY");
  if(!sum||!body) return;
  sum.addEventListener("click",e=>{
    if(e.target.closest(".notelink")) return;        // 點「數據說明」不要順便展開
    e.preventDefault();
    if(REDUCE.matches){ d.open=!d.open; return; }
    // 正在動的話，以「動畫的意圖」為準，而不是 d.open
    const opening = d.dataset.anim ? d.dataset.anim!=="open" : !d.open;
    const start = body.getBoundingClientRect().height;   // 先讀當前值，再取消舊動畫
    body.getAnimations().forEach(a=>a.cancel());
    d.dataset.anim = opening ? "open" : "close";
    if(opening) d.open = true;
    body.style.overflow="hidden";
    const end = opening ? body.scrollHeight : 0;
    const anim = body.animate(
      [{height:start+"px", opacity:opening?.4:1},
       {height:end+"px",   opacity:opening?1:.4}],
      {duration:400, easing:"cubic-bezier(.32,.72,0,1)"});
    let settled=false;
    const done = ()=>{
      if(settled || anim.playState==="idle") return;   // idle＝已被下一次點擊取消，交給它收尾
      settled=true;
      delete d.dataset.anim;
      body.style.overflow=""; body.style.height="";
      if(!opening) d.open=false;
    };
    anim.onfinish = done;
    setTimeout(done, 460);     // 分頁在背景時動畫會凍住，保險起見一定收得了尾
  });
}
function wireAllDetails(){ document.querySelectorAll("details").forEach(wireDetails); }
wireAllDetails();
