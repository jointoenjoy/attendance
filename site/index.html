<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>格威博報堂集團 × 練息場 · 參與統計</title>
<style>
  :root{ --bg:#f5f3ee; --card:#fffdf9; --ink:#23282a; --muted:#6d7175; --line:#e4e0d6;
    --accent:#2f8f83; --accent-d:#1f6b61; --accent-soft:#dcefeb;
    --shadow:0 1px 2px rgba(40,45,40,.05),0 8px 26px rgba(40,45,40,.07);}
  @media (prefers-color-scheme:dark){ :root{ --bg:#14171a; --card:#1b1f22; --ink:#e9e7e0; --muted:#9aa0a2;
    --line:#2c3236; --accent:#4db8aa; --accent-d:#7fd0c4; --accent-soft:#1e3d39;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);} }
  :root[data-theme="dark"]{ --bg:#14171a; --card:#1b1f22; --ink:#e9e7e0; --muted:#9aa0a2; --line:#2c3236;
    --accent:#4db8aa; --accent-d:#7fd0c4; --accent-soft:#1e3d39;}
  :root[data-theme="light"]{ --bg:#f5f3ee; --card:#fffdf9; --ink:#23282a; --muted:#6d7175; --line:#e4e0d6;
    --accent:#2f8f83; --accent-d:#1f6b61; --accent-soft:#dcefeb;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;padding:32px 18px;}
  .wrap{max-width:640px;width:100%}
  .eyebrow{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-d);font-weight:700;margin:0 0 8px}
  h1{font-size:1.7rem;line-height:1.28;margin:0 0 10px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
  .lede{color:var(--muted);margin:0 0 26px}
  .cards{display:grid;gap:14px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;transition:transform .14s,border-color .14s}
  a.card:hover{transform:translateY(-2px);border-color:var(--accent)}
  a.card .t{font-size:1.15rem;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  a.card .t .arw{color:var(--accent);font-weight:800}
  a.card .d{color:var(--muted);font-size:.94rem;margin:0}
  .foot{color:var(--muted);font-size:.8rem;margin-top:26px}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">練息場 Join to Enjoy × 格威博報堂集團</p>
    <h1>集團參與練息場活動 · 統計總覽</h1>
    <p class="lede">格威博報堂集團（日本博報堂 100% 持有）旗下成員公司，參與練息場身心活動的兩種視角。</p>
    <div class="cards">
      <a class="card" href="/all">
        <p class="t"><span class="arw">→</span> 全集團總覽</p>
        <p class="d">把所有成員公司併為「格威博報堂集團」一個單位，看整體參與（可互動分類、標記各 email 網域）。</p>
      </a>
      <a class="card" href="/part">
        <p class="t"><span class="arw">→</span> 各子公司細分</p>
        <p class="d">聯廣、米蘭 MDCG、先勢、台北博報堂 HTM 等各子公司「實際到場」的人次與人數，及各場報名／報到／網域明細。</p>
      </a>
    </div>
    <p class="foot">資料已去識別化，僅呈現公司層級彙總與 email 網域，不含姓名或完整帳號。</p>
  </div>
  <script>
    const root=document.documentElement;
    // 尊重系統主題即可；此頁不放切換鈕，保持簡潔。
  </script>
</body>
</html>
